name: build
on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Install cosign
      uses: sigstore/cosign-installer@v3.6.0
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rustflags: ""
        cache: false
    - name: Build
      run: ./build.sh
    - name: Build again
      run: |
        set -e
        mkdir /tmp/bsdloader-build
        cp -rf ./{.cargo,src,Cargo.toml,Cargo.lock,rust-toolchain.toml,build.sh} /tmp/bsdloader-build/
        cd /tmp/bsdloader-build/
        ./build.sh
    - name: Verify reproducibility
      run: |
        set -e
        for variant in openbsd freebsd; do
          artifact="bsdloader-${variant}.efi"

          # internally reproducible
          hexdump -C < "dist/${artifact}" > 1.hexdump
          hexdump -C < "/tmp/bsdloader-build/dist/${artifact}" > 2.hexdump
          diff -u 1.hexdump 2.hexdump

          # also check consistency with committed hash
          calculated_hash="$(sha256sum "dist/${artifact}" | head -c 64)"
          committed_hash="$(grep "  ${artifact}\$" reproducible-sha256.txt | head -c 64)"
          echo "${artifact}: calculated=${calculated_hash} committed=${committed_hash}"
          if [ "$calculated_hash" != "$committed_hash" ]; then
            echo "Hash mismatch for ${artifact}: $calculated_hash != $committed_hash"
            exit 1
          fi
        done
    - name: Sign
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -e
        mkdir build
        cp dist/bsdloader-openbsd.efi dist/bsdloader-freebsd.efi ./build/
        cd build
        for variant in openbsd freebsd; do
          cosign sign-blob -y \
            --bundle "bsdloader-${variant}.cosign-bundle.json" \
            "bsdloader-${variant}.efi"
        done
        ls -lash
    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./build/bsdloader-openbsd.efi
          ./build/bsdloader-openbsd.cosign-bundle.json
          ./build/bsdloader-freebsd.efi
          ./build/bsdloader-freebsd.cosign-bundle.json
        prerelease: true
