[package]
name = "bsdloader"
version = "0.1.4"
edition = "2021"

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[features]
# A backend feature is REQUIRED; there is no default. Build with exactly one of:
#   cargo build --release --no-default-features --features openbsd
#   cargo build --release --no-default-features --features freebsd
# OpenBSD/amd64 boot backend (bsd.rd / bsd via run_i386 handoff)
openbsd = []
# Original FreeBSD modinfo/memdisk backend
freebsd = []

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["digest"] }
hex = { version = "0.4", default-features = false }
log = "0.4"
miniz_oxide = { version = "0.8", default-features = false, features = [
    "with-alloc",
] }
rand_chacha = { version = "0.10.0", default-features = false }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
uefi = { version = "0.32", features = [
    "alloc",
    "logger",
    "panic_handler",
    "global_allocator",
] }
